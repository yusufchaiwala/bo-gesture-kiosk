<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>B&O Interactive Exhibition Kiosk</title>

  <!-- Model Viewer -->
  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      background: #0e0e0e;
      color: #eaeaea;
      font-family: Helvetica, Arial, sans-serif;
      display: grid;
      grid-template-columns: 280px 1fr;
      overflow: hidden;
    }

    /* ---------- SIDEBAR ---------- */
    nav {
      padding: 32px 24px;
      border-right: 1px solid #1f1f1f;
      display: flex;
      flex-direction: column;
    }

    .logo {
      width: 150px;
      margin-bottom: 48px;
      opacity: 0.95;
    }

    .product {
      margin-bottom: 20px;
      font-size: 14px;
      letter-spacing: 0.5px;
      opacity: 0.45;
      cursor: default;
    }

    .product.active {
      opacity: 1;
    }

    /* ---------- MAIN VIEW ---------- */
    main {
      position: relative;
      height: 100vh;
      overflow: hidden;
    }

    model-viewer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000;
    }

    /* ---------- DETAILS ---------- */
    .details {
      position: absolute;
      bottom: 32px;
      left: 32px;
      max-width: 360px;
      font-size: 14px;
      line-height: 1.6;
      opacity: 0.65;
      pointer-events: none;
    }

    /* ---------- STATE LABEL ---------- */
    .state {
      position: absolute;
      top: 32px;
      right: 32px;
      font-size: 12px;
      letter-spacing: 2px;
      opacity: 0.6;
    }
  </style>
</head>

<body>

  <!-- SIDEBAR -->
  <nav>
    <img src="assets/bo-logo.png" alt="Bang & Olufsen" class="logo">

    <div class="product active">Beosound Speaker</div>
    <div class="product">Coming Soon</div>
    <div class="product">Coming Soon</div>
  </nav>

  <!-- MAIN KIOSK VIEW -->
  <main>

    <model-viewer
      id="viewer"
      src="assets/models/speaker.glb"

      auto-rotate
      rotation-per-second="8deg"

      camera-controls
      disable-zoom
      interaction-prompt="none"

      exposure="1.2"
      shadow-intensity="1"
      environment-image="neutral"

      scale="4.5 4.5 4.5">
    </model-viewer>

    <div class="details" id="details">
      Sculpted aluminium form designed for intimate listening.<br>
      Gesture-enabled exhibition kiosk exploring form, presence, and interaction.
    </div>

    <div class="state" id="state">ATTRACT</div>

  </main>

<script>
  const states = ["ATTRACT", "EXPLORE", "FOCUS"];
  let current = 0;

  const viewer = document.getElementById("viewer");
  const details = document.getElementById("details");
  const stateLabel = document.getElementById("state");

  window.addEventListener("keydown", () => {
    current = (current + 1) % states.length;
    stateLabel.innerText = states[current];

    if (states[current] === "ATTRACT") {
      viewer.autoRotate = true;
      viewer.cameraControls = false;
      details.style.opacity = 0.4;
    }

    if (states[current] === "EXPLORE") {
      viewer.autoRotate = false;
      viewer.cameraControls = true;
      details.style.opacity = 0.6;
    }

    if (states[current] === "FOCUS") {
      viewer.autoRotate = false;
      viewer.cameraControls = true;
      details.style.opacity = 1;
    }
  });
</script>

</body>
</html>
