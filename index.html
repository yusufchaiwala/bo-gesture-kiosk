<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>B&O Interactive Exhibition Kiosk</title>

  <!-- Model Viewer -->
  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      display: grid;
      grid-template-columns: 300px 1fr;
      font-family: Helvetica, Arial, sans-serif;
      background: #111;
      overflow: hidden;
    }

    /* ---------- SIDEBAR (B&O STYLE) ---------- */
    nav {
      background: #f4f4f2; /* B&O neutral */
      padding: 40px 32px;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #ddd;
    }

    .logo {
      width: 160px;
      margin-bottom: 56px;
    }

    .product {
      font-size: 14px;
      letter-spacing: 1px;
      color: #777;
      margin-bottom: 24px;
    }

    .product.active {
      color: #000;
    }

    /* ---------- MAIN STAGE ---------- */
    main {
      position: relative;
      background: #0c0c0c;
    }

    model-viewer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #0c0c0c;
    }

    /* ---------- DETAILS ---------- */
    .details {
      position: absolute;
      bottom: 40px;
      left: 40px;
      max-width: 380px;
      font-size: 14px;
      line-height: 1.7;
      color: #bcbcbc;
      pointer-events: none;
    }

    /* ---------- STATE ---------- */
    .state {
      position: absolute;
      top: 40px;
      right: 40px;
      font-size: 12px;
      letter-spacing: 3px;
      color: #888;
    }
  </style>
</head>

<body>

  <!-- SIDEBAR -->
  <nav>
    <img src="assets/bo-logo.png" alt="Bang & Olufsen" class="logo">

    <div class="product active">BEOSOUND SPEAKER</div>
    <div class="product">COMING SOON</div>
    <div class="product">COMING SOON</div>
  </nav>

  <!-- MAIN -->
  <main>

    <model-viewer
      id="viewer"
      src="assets/models/speaker.glb"

      auto-rotate
      rotation-per-second="7deg"

      camera-controls
      disable-zoom
      interaction-prompt="none"

      exposure="1.25"
      environment-image="neutral"
      shadow-intensity="1"

      scale="4.8 4.8 4.8">
    </model-viewer>

    <div class="details">
      Sculpted aluminium form designed for intimate listening.<br>
      A gesture-based exhibition kiosk exploring presence, material, and sound.
    </div>

    <div class="state" id="state">ATTRACT</div>

  </main>

<script>
  const states = ["ATTRACT", "EXPLORE", "FOCUS"];
  let current = 0;

  const viewer = document.getElementById("viewer");
  const stateLabel = document.getElementById("state");

  window.addEventListener("keydown", () => {
    current = (current + 1) % states.length;
    stateLabel.innerText = states[current];

    if (states[current] === "ATTRACT") {
      viewer.autoRotate = true;
      viewer.cameraControls = false;
    }

    if (states[current] === "EXPLORE") {
      viewer.autoRotate = false;
      viewer.cameraControls = true;
    }

    if (states[current] === "FOCUS") {
      viewer.autoRotate = false;
      viewer.cameraControls = true;
    }
  });
</script>

</body>
</html>
