<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>B&o Kiosk</title>

  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      display: grid;
      grid-template-columns: 320px 1fr;
      font-family: Helvetica, Arial, sans-serif;
      background: #111;
      overflow: hidden;
    }

    /* ---------- SIDEBAR ---------- */
    nav {
      background: #f4f4f2;
      padding: 48px 36px;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #ddd;
    }

    .logo {
      width: 100px;
      margin-bottom: 64px;
    }

    .product-name {
      font-size: 14px;
      letter-spacing: 2px;
      color: #000;
      margin-bottom: 12px;
    }

    .tagline {
      font-size: 20px;
      line-height: 1.3;
      color: #000;
      margin-bottom: 32px;
    }

    /* ---------- MAIN STAGE ---------- */
    main {
      position: relative;
      background: #0c0c0c;
    }

    model-viewer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #0c0c0c;
    }

    /* ---------- PRODUCT DETAILS ---------- */
    .description {
      position: absolute;
      bottom: 48px;
      left: 48px;
      max-width: 420px;
      font-size: 14px;
      line-height: 1.7;
      color: #cfcfcf;
    }

    .purchase {
      position: absolute;
      bottom: 48px;
      right: 48px;
      text-align: right;
      color: #eaeaea;
    }

    .price {
      font-size: 24px;
      margin-bottom: 16px;
    }

    .cta {
      border: 1px solid #eaeaea;
      padding: 12px 28px;
      font-size: 14px;
      letter-spacing: 1px;
      display: inline-block;
    }

    /* ---------- STATE ---------- */
    .state {
      position: absolute;
      top: 48px;
      right: 48px;
      font-size: 12px;
      letter-spacing: 3px;
      color: #888;
    }
  </style>
</head>

<body>

  <!-- SIDEBAR -->
  <nav>
    <img src="assets/bo-logo.png" alt="Bang & Olufsen" class="logo">

    <div class="product-name">BEOSOUND A9</div>
    <div class="tagline">Powerful, minimalist speaker</div>
  </nav>

  <!-- MAIN -->
  <main>

    <model-viewer
      id="viewer"
      src="assets/models/speaker.glb"

      auto-rotate
      rotation-per-second="6deg"

      camera-controls
      disable-zoom
      interaction-prompt="none"

      exposure="1.25"
      environment-image="neutral"
      shadow-intensity="1"

      scale="4.8 4.8 4.8">
    </model-viewer>

    <div class="description">
      Sound and shape unite in this iconic, customisable speaker.<br>
      Seven drivers bring the power. A century of craft brings the form.
    </div>

    <div class="purchase">
      <div class="price">$4,650</div>
      <div class="cta">EXPERIENCE IN STORE</div>
    </div>

    <div class="state" id="state">ATTRACT</div>

  </main>

<script>
  const states = ["ATTRACT", "EXPLORE", "FOCUS"];
  let current = 0;

  const viewer = document.getElementById("viewer");
  const stateLabel = document.getElementById("state");

  window.addEventListener("keydown", () => {
    current = (current + 1) % states.length;
    stateLabel.innerText = states[current];

    if (states[current] === "ATTRACT") {
      viewer.autoRotate = true;
      viewer.cameraControls = false;
    }

    if (states[current] === "EXPLORE") {
      viewer.autoRotate = false;
      viewer.cameraControls = true;
    }

    if (states[current] === "FOCUS") {
      viewer.autoRotate = false;
      viewer.cameraControls = true;
    }
  });
</script>

</body>
</html>
