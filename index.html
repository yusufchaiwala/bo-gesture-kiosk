<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>B&O Exhibition Kiosk</title>

  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      display: grid;
      grid-template-columns: 320px 1fr;
      font-family: Helvetica, Arial, sans-serif;
      background: #111;
      overflow: hidden;
    }

    /* ---------- SIDEBAR ---------- */
    nav {
      background: #f4f4f2;
      padding: 48px 36px;
      border-right: 1px solid #ddd;
    }

    .logo {
      width: 110px;
      margin-bottom: 48px;
      opacity: 0.9;
    }

    .nav-item {
      font-size: 14px;
      letter-spacing: 2px;
      margin-bottom: 24px;
      color: #777;
      cursor: pointer;
    }

    .nav-item.active {
      color: #000;
    }

    /* ---------- MAIN ---------- */
    main {
      position: relative;
      background: #0c0c0c;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      background: #0c0c0c;
    }

    /* ---------- OVERLAYS ---------- */
    .description,
    .state,
    .hint,
    .coming-soon {
      pointer-events: none;
    }

    .description {
      position: absolute;
      bottom: 48px;
      left: 48px;
      max-width: 420px;
      font-size: 14px;
      line-height: 1.7;
      color: #cfcfcf;
    }

    .state {
      position: absolute;
      top: 48px;
      right: 48px;
      font-size: 12px;
      letter-spacing: 3px;
      color: #888;
    }

    .hint {
      position: absolute;
      bottom: 24px;
      left: 48px;
      font-size: 12px;
      letter-spacing: 1.5px;
      color: rgba(255,255,255,0.35);
    }

    /* ---------- CTA ---------- */
    .purchase {
      position: absolute;
      bottom: 48px;
      right: 48px;
      z-index: 10;
    }

    .price {
      font-size: 24px;
      color: #eaeaea;
      margin-bottom: 16px;
    }

    .cta {
      border: 1px solid #eaeaea;
      padding: 12px 28px;
      font-size: 14px;
      letter-spacing: 1px;
      color: #eaeaea;
      text-decoration: none;
      transition: background 0.25s ease, color 0.25s ease;
    }

    .cta:hover {
      background: #eaeaea;
      color: #000;
    }
  </style>
</head>

<body>

  <nav>
    <img src="assets/bo-logo.png" class="logo" alt="Bang & Olufsen" />
    <div class="nav-item active">BEOSOUND A9</div>
    <div class="nav-item">COMING SOON</div>
    <div class="nav-item">COMING SOON</div>
    <div class="nav-item">COMING SOON</div>
  </nav>

  <main>

    <!-- TURN-TABLE MODEL -->
    <model-viewer
      id="viewer"
      src="assets/models/speaker.glb"
      auto-rotate
      rotation-per-second="2deg"
      camera-orbit="0deg 75deg 4.8m"
      min-camera-orbit="-Infinity 60deg 3m"
      max-camera-orbit="Infinity  85deg 6m"
      interaction-prompt="none"
      exposure="1.25"
      environment-image="neutral"
      shadow-intensity="1">
    </model-viewer>

    <div class="description">
      Sound and shape unite in this iconic, customisable speaker.
    </div>

    <div class="purchase">
      <div class="price">$4,650</div>
      <a
        class="cta"
        href="https://www.bang-olufsen.com/en/int/speakers/beosound-a9"
        target="_blank">
        EXPERIENCE IN STORE
      </a>
    </div>

    <div class="state">ATTRACT</div>

    <div class="hint">
      Drag to rotate · Scroll to zoom
    </div>

  </main>

<script>
  const viewer = document.getElementById("viewer");

  let rotationY = 0;
  let lastX = null;

  viewer.addEventListener("pointerdown", e => {
    lastX = e.clientX;
    viewer.autoRotate = false;
  });

  viewer.addEventListener("pointermove", e => {
    if (lastX === null) return;
    const dx = e.clientX - lastX;
    rotationY += dx * 0.25;
    viewer.orientation = `0deg ${rotationY}deg 0deg`;
    lastX = e.clientX;
  });

  viewer.addEventListener("pointerup", () => {
    lastX = null;
  });

  viewer.addEventListener("pointerleave", () => {
    lastX = null;
  });
</script>

</body>
</html>
