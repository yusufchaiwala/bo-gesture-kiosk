<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>B&O Interactive Exhibition Kiosk</title>

  <!-- MODEL VIEWER -->
  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #0e0e0e;
      color: #eaeaea;
      font-family: Helvetica, Arial, sans-serif;
      display: grid;
      grid-template-columns: 280px 1fr;
    }

    nav {
      padding: 32px 24px;
      border-right: 1px solid #222;
    }

    nav h1 {
      font-size: 18px;
      letter-spacing: 2px;
      margin-bottom: 40px;
    }

    .product {
      margin-bottom: 20px;
      opacity: 0.5;
      cursor: pointer;
    }

    .product.active {
      opacity: 1;
    }

    main {
      display: grid;
      grid-template-rows: 1fr 140px;
    }

    model-viewer {
      background: #000;
    }

    .details {
      padding: 24px 32px;
      border-top: 1px solid #222;
      font-size: 14px;
      line-height: 1.6;
      opacity: 0.8;
    }

    .state {
      position: fixed;
      top: 24px;
      right: 32px;
      font-size: 12px;
      letter-spacing: 2px;
      opacity: 0.6;
    }
  </style>
</head>

<body>

  <!-- SIDEBAR -->
  <nav>
    <h1>BANG & OLUFSEN</h1>
    <div class="product active">Beosound Speaker</div>
    <div class="product">Coming Soon</div>
    <div class="product">Coming Soon</div>
  </nav>

  <!-- MAIN -->
  <main>
    <model-viewer
  id="viewer"
  src="assets/models/speaker.glb"
  camera-controls
  auto-rotate
  rotation-per-second="15deg"
  exposure="1.2"
  shadow-intensity="1"

  camera-orbit="0deg 75deg 2.2m"
  min-camera-orbit="auto auto 0.1m"
  max-camera-orbit="auto auto 3.5m"

  field-of-view="25deg">
</model-viewer>


    <div class="details" id="details">
      Sculpted aluminium form designed for intimate listening.<br>
      Gesture-enabled kiosk prototype for exhibition interaction.
    </div>
  </main>

  <div class="state" id="state">ATTRACT</div>

<script>
  const states = ["ATTRACT", "EXPLORE", "FOCUS"];
  let current = 0;

  const stateLabel = document.getElementById("state");
  const viewer = document.getElementById("viewer");
  const details = document.getElementById("details");

  window.addEventListener("keydown", () => {
    current = (current + 1) % states.length;
    stateLabel.innerText = states[current];

    if (states[current] === "ATTRACT") {
      viewer.autoRotate = true;
      viewer.cameraControls = false;
      details.style.opacity = 0.4;
    }

    if (states[current] === "EXPLORE") {
      viewer.autoRotate = false;
      viewer.cameraControls = true;
      details.style.opacity = 0.7;
    }

    if (states[current] === "FOCUS") {
      viewer.autoRotate = false;
      viewer.cameraControls = true;
      details.style.opacity = 1;
    }
  });
</script>

</body>
</html>
