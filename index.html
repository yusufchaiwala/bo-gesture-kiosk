<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>B&O Interactive Exhibition Kiosk</title>

  <!-- Model Viewer -->
  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      display: grid;
      grid-template-columns: 320px 1fr;
      font-family: Helvetica, Arial, sans-serif;
      background: #111;
      overflow: hidden;
    }

    /* ---------- SIDEBAR ---------- */
    nav {
      background: #f4f4f2;
      padding: 48px 36px;
      border-right: 1px solid #ddd;
    }

    .logo {
      width: 110px;
      margin-bottom: 48px;
      opacity: 0.9;
    }

    .nav-item {
      font-size: 14px;
      letter-spacing: 2px;
      margin-bottom: 24px;
      color: #777;
      cursor: pointer;
    }

    .nav-item.active {
      color: #000;
    }

    /* ---------- MAIN ---------- */
    main {
      position: relative;
      background: #0c0c0c;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      background: #0c0c0c;
    }

    /* ---------- OVERLAYS (NON-BLOCKING) ---------- */
    .description,
    .state,
    .hint,
    .coming-soon {
      pointer-events: none;
    }

    .description {
      position: absolute;
      bottom: 48px;
      left: 48px;
      max-width: 420px;
      font-size: 14px;
      line-height: 1.7;
      color: #cfcfcf;
    }

    .state {
      position: absolute;
      top: 48px;
      right: 48px;
      font-size: 12px;
      letter-spacing: 3px;
      color: #888;
    }

    .hint {
      position: absolute;
      bottom: 24px;
      left: 48px;
      font-size: 12px;
      letter-spacing: 1.5px;
      color: rgba(255,255,255,0.35);
    }

    .coming-soon {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      letter-spacing: 6px;
      color: #555;
    }

    /* ---------- CTA ---------- */
    .purchase {
      position: absolute;
      bottom: 48px;
      right: 48px;
      z-index: 10;
    }

    .price {
      font-size: 24px;
      color: #eaeaea;
      margin-bottom: 16px;
    }

    .cta {
      border: 1px solid #eaeaea;
      padding: 12px 28px;
      font-size: 14px;
      letter-spacing: 1px;
      color: #eaeaea;
      text-decoration: none;
      transition: background 0.25s ease, color 0.25s ease;
    }

    .cta:hover {
      background: #eaeaea;
      color: #000;
    }
  </style>
</head>

<body>

  <!-- SIDEBAR -->
  <nav>
  <img src="assets/bo-logo.png" class="logo" alt="Bang & Olufsen" />

  <div class="nav-item active" onclick="showProduct()">BEOSOUND A9</div>
  <div class="nav-item" onclick="showComingSoon()">COMING SOON</div>
  <div class="nav-item" onclick="showComingSoon()">COMING SOON</div>
  <div class="nav-item" onclick="showComingSoon()">COMING SOON</div>
</nav>

  <!-- MAIN -->
  <main>

    <!-- THIS DOES ALL THE MAGIC -->
    <model-viewer
      src="assets/models/speaker.glb"
      camera-controls
      auto-rotate
      rotation-per-second="3deg"
      camera-orbit="0deg 75deg 4.8m"
      min-camera-orbit="-Infinity 55deg 3.5m"
      max-camera-orbit="Infinity 85deg 6m"
      interaction-prompt="none"
      exposure="1.25"
      environment-image="neutral"
      shadow-intensity="1">
    </model-viewer>
<div class="coming-soon">
  COMING SOON
</div>

    <div class="description">
      Sound and shape unite in this iconic, customisable speaker.<br>
      Seven drivers bring the power. A century of craft brings the form.
    </div>

    <div class="purchase">
      <div class="price">$4,650</div>
      <a
        class="cta"
        href="https://www.bang-olufsen.com/en/int/speakers/beosound-a9"
        target="_blank">
        EXPERIENCE IN STORE
      </a>
    </div>

    <div class="state">ATTRACT</div>

    <div class="hint">
      Drag to rotate · Scroll to zoom
    </div>

  </main>
<script>
  const viewer = document.querySelector("model-viewer");
  const comingSoon = document.querySelector(".coming-soon");
  const description = document.querySelector(".description");
  const purchase = document.querySelector(".purchase");
  const navItems = document.querySelectorAll(".nav-item");

  function clearActive() {
    navItems.forEach(item => item.classList.remove("active"));
  }

  function showProduct() {
    clearActive();
    navItems[0].classList.add("active");

    viewer.style.display = "block";
    description.style.display = "block";
    purchase.style.display = "block";
    comingSoon.style.display = "none";
  }

  function showComingSoon() {
    clearActive();

    // mark all "coming soon" items as active when clicked
    for (let i = 1; i < navItems.length; i++) {
      navItems[i].classList.add("active");
    }

    viewer.style.display = "none";
    description.style.display = "none";
    purchase.style.display = "none";
    comingSoon.style.display = "flex";
  }<script>
  const ambience = document.getElementById("ambience");

  // Start very soft
  ambience.volume = 0;

  let activated = false;

  function activateSound() {
    if (activated) return;
    activated = true;

    ambience.muted = false;

    // Gentle fade-in
    let vol = 0;
    const fade = setInterval(() => {
      vol += 0.02;
      ambience.volume = Math.min(vol, 0.25); // premium level
      if (vol >= 0.25) clearInterval(fade);
    }, 100);
  }

  // First real interaction unmutes sound
  window.addEventListener("pointerdown", activateSound, { once: true });
  window.addEventListener("keydown", activateSound, { once: true });
</script>

</script>
<audio id="ambience" autoplay muted loop>
  <source src="assets/ambience.mp3" type="audio/mpeg">
</audio>

</body>
</html>
