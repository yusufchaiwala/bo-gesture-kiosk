<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>B&O Kiosk</title>

  <!-- Model Viewer -->
  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <!-- MediaPipe -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      display: grid;
      grid-template-columns: 320px 1fr;
      font-family: Helvetica, Arial, sans-serif;
      background: #111;
      overflow: hidden;
    }

    /* ---------- SIDEBAR ---------- */
    nav {
      background: #f4f4f2;
      padding: 48px 36px;
      border-right: 1px solid #ddd;
    }

    .logo {
      width: 110px;
      margin-bottom: 48px;
      opacity: 0.9;
    }

    .nav-item {
      font-size: 14px;
      letter-spacing: 2px;
      margin-bottom: 24px;
      color: #777;
      cursor: pointer;
    }

    .nav-item.active {
      color: #000;
    }

    /* ---------- MAIN STAGE ---------- */
    main {
      position: relative;
      background: #0c0c0c;
    }

    model-viewer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #0c0c0c;
    }

    /* ---------- DETAILS ---------- */
    .description {
      position: absolute;
      bottom: 48px;
      left: 48px;
      max-width: 420px;
      font-size: 14px;
      line-height: 1.7;
      color: #cfcfcf;
      z-index: 10;
    }

    .purchase {
      position: absolute;
      bottom: 48px;
      right: 48px;
      text-align: right;
      z-index: 20;
    }

    .price {
      font-size: 24px;
      color: #eaeaea;
      margin-bottom: 16px;
    }

    .cta {
      border: 1px solid #eaeaea;
      padding: 12px 28px;
      font-size: 14px;
      letter-spacing: 1px;
      display: inline-block;
      color: #eaeaea;
      text-decoration: none;
      transition: background 0.25s ease, color 0.25s ease;
    }

    .cta:hover {
      background: #eaeaea;
      color: #000;
      cursor: pointer;
    }

    /* ---------- COMING SOON ---------- */
    .coming-soon {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      letter-spacing: 6px;
      color: #555;
      z-index: 5;
    }

    /* ---------- STATE ---------- */
    .state {
      position: absolute;
      top: 48px;
      right: 48px;
      font-size: 12px;
      letter-spacing: 3px;
      color: #888;
      z-index: 10;
    }
  </style>
</head>

<body>

  <!-- SIDEBAR -->
  <nav>
    <img src="assets/bo-logo.png" class="logo" alt="Bang & Olufsen" />

    <div class="nav-item active" onclick="showProduct(this)">BEOSOUND A9</div>
    <div class="nav-item" onclick="showComingSoon(this)">COMING SOON</div>
    <div class="nav-item" onclick="showComingSoon(this)">COMING SOON</div>
    <div class="nav-item" onclick="showComingSoon(this)">COMING SOON</div>
  </nav>

  <!-- MAIN -->
  <main>

    <model-viewer
      id="viewer"
      src="assets/models/speaker.glb"
      auto-rotate
      rotation-per-second="6deg"
      camera-controls
      disable-zoom
      interaction-prompt="none"
      exposure="1.25"
      environment-image="neutral"
      shadow-intensity="1"
      scale="4.8 4.8 4.8">
    </model-viewer>

    <div class="coming-soon" id="comingSoon">COMING SOON</div>

    <div class="description" id="description">
      Sound and shape unite in this iconic, customisable speaker.<br>
      Seven drivers bring the power. A century of craft brings the form.
    </div>

    <div class="purchase" id="purchase">
      <div class="price">$4,650</div>
      <a
        class="cta"
        href="https://www.bang-olufsen.com/en/int/speakers/beosound-a9"
        target="_blank"
        rel="noopener noreferrer">
        EXPERIENCE IN STORE
      </a>
    </div>

    <div class="state" id="state">ATTRACT</div>
<div id="gestureHint"
     style="
       position:absolute;
       top:50%;
       left:50%;
       transform:translate(-50%,-50%);
       color:#888;
       letter-spacing:2px;
       font-size:14px;
       z-index:30;">
  PRESS “G” TO ENABLE GESTURE CONTROL
</div>

  </main>

  <!-- Hidden Camera -->
  <video id="camera" style="display:none;"></video>

<script>
  /* ---------- SIDEBAR LOGIC ---------- */
  const viewer = document.getElementById("viewer");
  const comingSoon = document.getElementById("comingSoon");
  const description = document.getElementById("description");
  const purchase = document.getElementById("purchase");
  const navItems = document.querySelectorAll(".nav-item");

  function clearActive() {
    navItems.forEach(i => i.classList.remove("active"));
  }

  function showProduct(el) {
    clearActive();
    el.classList.add("active");
    viewer.style.display = "block";
    comingSoon.style.display = "none";
    description.style.display = "block";
    purchase.style.display = "block";
  }

  function showComingSoon(el) {
    clearActive();
    el.classList.add("active");
    viewer.style.display = "none";
    description.style.display = "none";
    purchase.style.display = "none";
    comingSoon.style.display = "flex";
  }

  /* ---------- STATE LOGIC ---------- */
  const states = ["ATTRACT", "EXPLORE", "FOCUS"];
  let stateIndex = 0;
  const stateLabel = document.getElementById("state");

  window.addEventListener("keydown", () => {
    stateIndex = (stateIndex + 1) % states.length;
    stateLabel.innerText = states[stateIndex];

    viewer.autoRotate = states[stateIndex] === "ATTRACT";
    viewer.cameraControls = states[stateIndex] !== "ATTRACT";
  });

  /* ---------- GESTURE CONTROL ---------- */
  const video = document.getElementById("camera");
  let yaw = 0, pitch = 75, zoom = 4.8;

  const hands = new Hands({
    locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
  });

  hands.setOptions({
    maxNumHands: 2,
    minDetectionConfidence: 0.7,
    minTrackingConfidence: 0.7
  });

  hands.onResults(results => {
    if (!results.multiHandLandmarks) return;

    const count = results.multiHandLandmarks.length;

    if (count === 1) {
      const p = results.multiHandLandmarks[0][9];
      yaw = (p.x - 0.5) * 360;
      pitch = 60 + (0.5 - p.y) * 30;
    }

    if (count === 2) {
      const a = results.multiHandLandmarks[0][9];
      const b = results.multiHandLandmarks[1][9];
      zoom = Math.min(6, Math.max(3, 5 - Math.abs(a.x - b.x) * 5));
    }

   viewer.setAttribute(
  "camera-orbit",
  `${yaw}deg ${pitch}deg ${zoom}m`
);

  });

  let cam = null;
let gestureEnabled = false;
const hint = document.getElementById("gestureHint");

window.addEventListener("keydown", (e) => {
  if (e.key.toLowerCase() === "g" && !gestureEnabled) {
    gestureEnabled = true;
    hint.innerText = "GESTURE CONTROL ACTIVE";

    cam = new Camera(video, {
      onFrame: async () => {
        await hands.send({ image: video });
      },
      width: 640,
      height: 480
    });

    cam.start();
  }
});

</script>

</body>
</html>
