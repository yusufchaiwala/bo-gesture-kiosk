<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>B&O Interactive Exhibition Kiosk</title>

  <!-- Model Viewer -->
  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      display: grid;
      grid-template-columns: 320px 1fr;
      font-family: Helvetica, Arial, sans-serif;
      background: #111;
      overflow: hidden;
    }

    /* ---------- SIDEBAR ---------- */
    nav {
      background: #f4f4f2;
      padding: 48px 36px;
      border-right: 1px solid #ddd;
    }

    .logo {
      width: 110px;
      margin-bottom: 48px;
      opacity: 0.9;
    }

    .nav-item {
      font-size: 14px;
      letter-spacing: 2px;
      margin-bottom: 24px;
      color: #777;
      cursor: pointer;
    }

    .nav-item.active {
      color: #000;
    }

    /* ---------- MAIN STAGE ---------- */
    main {
      position: relative;
      background: #0c0c0c;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      background: #0c0c0c;
    }

    /* ---------- PRODUCT DETAILS ---------- */
    .description {
      position: absolute;
      bottom: 48px;
      left: 48px;
      max-width: 420px;
      font-size: 14px;
      line-height: 1.7;
      color: #cfcfcf;
      z-index: 10;
      pointer-events: none;
    }

    .purchase {
      position: absolute;
      bottom: 48px;
      right: 48px;
      text-align: right;
      z-index: 20;
    }

    .price {
      font-size: 24px;
      color: #eaeaea;
      margin-bottom: 16px;
    }

    .cta {
      border: 1px solid #eaeaea;
      padding: 12px 28px;
      font-size: 14px;
      letter-spacing: 1px;
      display: inline-block;
      color: #eaeaea;
      text-decoration: none;
      transition: background 0.25s ease, color 0.25s ease;
    }

    .cta:hover {
      background: #eaeaea;
      color: #000;
      cursor: pointer;
    }

    /* ---------- COMING SOON ---------- */
    .coming-soon {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      letter-spacing: 6px;
      color: #555;
      z-index: 5;
    }

    /* ---------- STATE ---------- */
    .state {
      position: absolute;
      top: 48px;
      right: 48px;
      font-size: 12px;
      letter-spacing: 3px;
      color: #888;
      z-index: 10;
    }

    /* ---------- INSTRUCTION ---------- */
    .hint {
      position: absolute;
      bottom: 24px;
      left: 48px;
      font-size: 12px;
      letter-spacing: 1.5px;
      color: rgba(255,255,255,0.35);
      z-index: 15;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <!-- SIDEBAR -->
  <nav>
    <img src="assets/bo-logo.png" class="logo" alt="Bang & Olufsen" />

    <div class="nav-item active" onclick="showProduct(this)">BEOSOUND A9</div>
    <div class="nav-item" onclick="showComingSoon(this)">COMING SOON</div>
    <div class="nav-item" onclick="showComingSoon(this)">COMING SOON</div>
    <div class="nav-item" onclick="showComingSoon(this)">COMING SOON</div>
  </nav>

  <!-- MAIN -->
  <main>

    <model-viewer
      id="viewer"
      src="assets/models/speaker.glb"
      camera-controls
      auto-rotate
      rotation-per-second="4deg"
      interaction-prompt="none"
      exposure="1.25"
      environment-image="neutral"
      shadow-intensity="1"
      scale="4.8 4.8 4.8">
    </model-viewer>

    <div class="coming-soon" id="comingSoon">COMING SOON</div>

    <div class="description" id="description">
      Sound and shape unite in this iconic, customisable speaker.<br>
      Seven drivers bring the power. A century of craft brings the form.
    </div>

    <div class="purchase" id="purchase">
      <div class="price">$4,650</div>
      <a
        class="cta"
        href="https://www.bang-olufsen.com/en/int/speakers/beosound-a9"
        target="_blank"
        rel="noopener noreferrer">
        EXPERIENCE IN STORE
      </a>
    </div>

    <div class="state" id="state">ATTRACT</div>

    <div class="hint">
      Drag to rotate · Scroll to zoom · Press space to focus
    </div>

  </main>

<script>
  const viewer = document.getElementById("viewer");
  const comingSoon = document.getElementById("comingSoon");
  const description = document.getElementById("description");
  const purchase = document.getElementById("purchase");
  const navItems = document.querySelectorAll(".nav-item");
  const stateLabel = document.getElementById("state");

  function clearActive() {
    navItems.forEach(i => i.classList.remove("active"));
  }

  function showProduct(el) {
    clearActive();
    el.classList.add("active");
    viewer.style.display = "block";
    comingSoon.style.display = "none";
    description.style.display = "block";
    purchase.style.display = "block";
  }

  function showComingSoon(el) {
    clearActive();
    el.classList.add("active");
    viewer.style.display = "none";
    description.style.display = "none";
    purchase.style.display = "none";
    comingSoon.style.display = "flex";
  }

  const states = ["ATTRACT", "EXPLORE", "FOCUS"];
  let stateIndex = 0;

  window.addEventListener("keydown", (e) => {
    if (e.code === "Space") {
      stateIndex = (stateIndex + 1) % states.length;
      stateLabel.innerText = states[stateIndex];
      viewer.autoRotate = states[stateIndex] === "ATTRACT";
    }
  });
</script>

</body>
</html>
