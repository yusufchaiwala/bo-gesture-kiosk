<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>B&o Kiosk</title>

  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      display: grid;
      grid-template-columns: 320px 1fr;
      font-family: Helvetica, Arial, sans-serif;
      background: #111;
      overflow: hidden;
    }

    /* ---------- SIDEBAR ---------- */
    nav {
      background: #f4f4f2;
      padding: 48px 36px;
      border-right: 1px solid #ddd;
    }

    .logo {
      width: 110px;
      margin-bottom: 48px;
    }

    .nav-item {
      font-size: 14px;
      letter-spacing: 2px;
      margin-bottom: 24px;
      color: #777;
      cursor: pointer;
    }

    .nav-item.active {
      color: #000;
    }

    /* ---------- MAIN ---------- */
    main {
      position: relative;
      background: #0c0c0c;
    }

    model-viewer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #0c0c0c;
    }

    /* ---------- DETAILS ---------- */
    .description {
      position: absolute;
      bottom: 48px;
      left: 48px;
      max-width: 420px;
      font-size: 14px;
      line-height: 1.7;
      color: #cfcfcf;
    }

    .purchase {
      position: absolute;
      bottom: 48px;
      right: 48px;
      text-align: right;
      color: #eaeaea;
    }

    .price {
      font-size: 24px;
      margin-bottom: 16px;
    }

    .cta {
      border: 1px solid #eaeaea;
      padding: 12px 28px;
      font-size: 14px;
      letter-spacing: 1px;
      display: inline-block;
    }

    /* ---------- COMING SOON ---------- */
    .coming-soon {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      letter-spacing: 6px;
      color: #555;
    }

    /* ---------- STATE ---------- */
    .state {
      position: absolute;
      top: 48px;
      right: 48px;
      font-size: 12px;
      letter-spacing: 3px;
      color: #888;
    }
  </style>
</head>

<body>

  <!-- SIDEBAR -->
  <nav>
    <img src="assets/bo-logo.png" alt="Bang & Olufsen" class="logo">

    <div class="nav-item active" onclick="showProduct()">BEOSOUND A9</div>
    <div class="nav-item" onclick="showComingSoon(this)">COMING SOON</div>
    <div class="nav-item" onclick="showComingSoon(this)">COMING SOON</div>
    <div class="nav-item" onclick="showComingSoon(this)">COMING SOON</div>
  </nav>

  <!-- MAIN -->
  <main>

    <model-viewer
      id="viewer"
      src="assets/models/speaker.glb"
      auto-rotate
      rotation-per-second="6deg"
      camera-controls
      disable-zoom
      interaction-prompt="none"
      exposure="1.25"
      environment-image="neutral"
      shadow-intensity="1"
      scale="4.8 4.8 4.8">
    </model-viewer>

    <div class="coming-soon" id="comingSoon">
      COMING SOON
    </div>

    <div class="description" id="description">
      Sound and shape unite in this iconic, customisable speaker.<br>
      Seven drivers bring the power. A century of craft brings the form.
    </div>

    <div class="purchase" id="purchase">
      <div class="price">$4,650</div>
      <div class="cta">EXPERIENCE IN STORE</div>
    </div>

    <div class="state" id="state">ATTRACT</div>

  </main>

<script>
  const viewer = document.getElementById("viewer");
  const comingSoon = document.getElementById("comingSoon");
  const description = document.getElementById("description");
  const purchase = document.getElementById("purchase");
  const stateLabel = document.getElementById("state");
  const navItems = document.querySelectorAll(".nav-item");

  function clearActive() {
    navItems.forEach(item => item.classList.remove("active"));
  }

  function showProduct() {
    clearActive();
    navItems[0].classList.add("active");

    viewer.style.display = "block";
    comingSoon.style.display = "none";
    description.style.display = "block";
    purchase.style.display = "block";
  }

  function showComingSoon(el) {
    clearActive();
    el.classList.add("active");

    viewer.style.display = "none";
    description.style.display = "none";
    purchase.style.display = "none";
    comingSoon.style.display = "flex";
  }

  // STATE LOGIC (gesture proxy)
  const states = ["ATTRACT", "EXPLORE", "FOCUS"];
  let current = 0;

  window.addEventListener("keydown", () => {
    current = (current + 1) % states.length;
    stateLabel.innerText = states[current];

    if (states[current] === "ATTRACT") {
      viewer.autoRotate = true;
      viewer.cameraControls = false;
    } else {
      viewer.autoRotate = false;
      viewer.cameraControls = true;
    }
  });
</script>

</body>
</html>
